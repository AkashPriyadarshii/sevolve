[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevolve"
version = "0.1.0"
description = "Self-evolving harness for LLM agents. Evolve skills, prompts, and rules from real execution traces. No GPU, no weight training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AkashPriyadarshii" }]
keywords = ["llm", "agents", "self-improvement", "evolution", "claude", "prompts", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sevolve = "engine.cli:main"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
