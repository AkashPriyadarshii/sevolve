[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sevolve"
version = "0.2.0"
description = "Zero-GPU self-evolving code graph and cognitive brain for AI agents. Pure Python stdlib."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akash Priyadarshi", email = "akashpriyadarshi.dev@gmail.com" }]
keywords = [
    "code-graph",
    "ast-parser",
    "knowledge-graph",
    "agent-memory",
    "self-evolving",
    "claude-code",
    "cursorrules",
    "openclaw",
    "mcp-server",
    "hebbian-learning",
    "pagerank",
    "obsidian-vault",
    "prompt-optimization",
    "zero-gpu",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://akashpriyadarshii.github.io/sevolve"
Repository = "https://github.com/AkashPriyadarshii/sevolve"
Issues = "https://github.com/AkashPriyadarshii/sevolve/issues"
Author = "https://akashpriyadarshii.github.io/Resume/"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sevolve = "engine.cli:main"

[tool.setuptools]
packages = ["engine", "engine.brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
